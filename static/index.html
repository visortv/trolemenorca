<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Menorca Bus · TMSA</title>
<style>
:root{
 --red:#c8102e; --red-dark:#9e0c24; --ink:#17202a; --muted:#68727d;
 --bg:#f3f5f7; --card:#fff; --line:#dfe4e8; --soft:#f7f8fa;
 --shadow:0 8px 30px rgba(18,28,45,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit}

/* CABECERA */
.topbar{
 background:#fff;
 border-bottom:4px solid var(--red);
 box-shadow:0 2px 12px rgba(0,0,0,.07);
}
.header-inner{
 max-width:1080px;margin:auto;padding:10px 18px;
 display:flex;align-items:center;justify-content:space-between;gap:18px;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand img{width:66px;height:66px;object-fit:contain}
.brand-text{line-height:1}
.brand-text .tmsa{
 font-size:35px;font-weight:900;font-style:italic;letter-spacing:-2px;color:var(--red)
}
.brand-text .sub{
 margin-top:4px;font-size:10px;font-weight:800;letter-spacing:.85px;color:#333
}

/* IDIOMAS */
.languages{display:flex;align-items:center;gap:7px}
.lang{
 width:46px;height:42px;border:1px solid #d9dee5;background:#fff;
 border-radius:9px;cursor:pointer;display:flex;
 align-items:center;justify-content:center;
 transition:.15s ease;
}
.lang:hover{transform:translateY(-1px);border-color:#aeb6bf}
.lang.active{border:2px solid var(--red);background:#fff6f7}
.flag{font-size:22px;line-height:1}
.flag-ca{
 width:23px;height:16px;border-radius:2px;
 background:repeating-linear-gradient(
   to bottom,
   #f4cf21 0,#f4cf21 2px,
   #c8102e 2px,#c8102e 4px
 );
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)
}

/* CONTENIDO */
main{max-width:1080px;margin:auto;padding:20px 16px 45px}
.planner{
 background:#fff;border:1px solid #e7eaee;border-radius:16px;
 box-shadow:var(--shadow);overflow:hidden
}
.planner-head{
 padding:18px 20px 14px;
 display:grid;grid-template-columns:minmax(0,1fr) 270px;
 align-items:end;gap:22px;border-bottom:1px solid #edf0f2
}
.title-wrap h1{font-size:27px;margin:0 0 5px}
.title-wrap p{margin:0;color:var(--muted);font-size:14px}
.date-wrap label,.field label,.time-display-label{
 display:block;font-size:11px;font-weight:900;text-transform:uppercase;
 letter-spacing:.55px;color:#4d5660;margin-bottom:6px
}
input,select{
 width:100%;height:46px;border:1px solid #ccd3da;border-radius:9px;
 padding:0 12px;background:#fff;color:#18212a;font-size:15px
}
input:focus,select:focus{outline:3px solid rgba(200,16,46,.10);border-color:var(--red)}
select:disabled,input:disabled{background:#f1f3f5;color:#9199a1}

/* DOS FILAS DEL VIAJE */
.journey-form{padding:18px 20px 16px}
.journey-row{
 display:grid;
 grid-template-columns:minmax(180px,1.05fr) minmax(280px,1.55fr) minmax(150px,.7fr);
 gap:12px;align-items:end;
 padding:14px;border-radius:12px;
 border:1px solid #e6e9ed;background:#fafbfc;
}
.journey-row + .journey-row{margin-top:11px}
.journey-row.two-cols{grid-template-columns:1fr 1fr}
.journey-row.origin-row{border-left:5px solid var(--red)}
.journey-row.destination-row{border-left:5px solid #4d5966}
.time-readonly{
 height:46px;border:1px solid #ccd3da;border-radius:9px;
 display:flex;align-items:center;padding:0 13px;background:#f1f3f5;
 font-weight:900;font-size:19px;color:#8a929a
}
.time-readonly.ready{background:#fff7f8;border-color:#e7b4bd;color:var(--red)}

.status{
 margin-top:13px;padding:10px 12px;border-radius:9px;
 background:#f6f7f9;color:var(--muted);font-size:13px
}
.good{color:#17723b;font-weight:700}
.bad{color:#b3261e;font-weight:700}

/* RESULTADO */
.result-card{
 margin-top:16px;background:#fff;border:1px solid #e3e7eb;
 border-radius:16px;box-shadow:var(--shadow);overflow:hidden
}
.result-head{
 display:flex;align-items:center;gap:12px;padding:14px 18px;
 color:#fff;background:linear-gradient(100deg,var(--red),var(--red-dark))
}
.line-code{
 background:#fff;color:var(--red);font-weight:900;font-size:20px;
 padding:7px 11px;border-radius:8px
}
.line-name{font-weight:800;font-size:18px}
.result-body{padding:18px}
.trip-row{
 display:grid;grid-template-columns:90px minmax(0,1fr) 90px;
 align-items:center;gap:14px;padding:13px 15px;
 border-radius:11px;background:#f7f8fa;border:1px solid #e9ecef
}
.trip-row + .trip-row{margin-top:9px}
.trip-kind{
 font-size:11px;font-weight:900;text-transform:uppercase;color:#69727d
}
.trip-place{font-size:16px;font-weight:750;line-height:1.35}
.trip-hour{
 text-align:right;font-size:28px;font-weight:900;color:var(--red)
}
.route-info{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.route-title{
 margin-bottom:8px;font-size:11px;font-weight:900;text-transform:uppercase;
 letter-spacing:.5px;color:#555
}
.towns{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:700}
.town{background:#f0f2f4;padding:6px 10px;border-radius:18px;font-size:13px}
.arrow{color:var(--red);font-weight:900}
.fare{
 margin-top:15px;display:flex;justify-content:space-between;align-items:center;
 padding:11px 13px;background:#fff6f7;border:1px solid #efc6cd;border-radius:10px
}
.fare strong{font-size:21px;color:var(--red)}
.meta{margin-top:12px;color:var(--muted);font-size:12px}
.official-link{display:inline-block;margin-top:11px;color:var(--red);font-weight:800;text-decoration:none}
html[dir="rtl"] body{direction:rtl}
html[dir="rtl"] .header-inner,
html[dir="rtl"] .brand,
html[dir="rtl"] .planner-head,
html[dir="rtl"] .journey-row,
html[dir="rtl"] .trip-row,
html[dir="rtl"] .fare{direction:rtl}
html[dir="rtl"] .trip-hour{text-align:left}
html[dir="rtl"] .towns{justify-content:flex-start}

@media(max-width:760px){
 .header-inner{align-items:flex-start}
 .languages{gap:4px;flex-wrap:wrap;justify-content:flex-end}
 .lang{width:40px;height:38px}
 .planner-head{grid-template-columns:1fr}
 .date-wrap{max-width:none}
 .journey-row,.journey-row.two-cols{grid-template-columns:1fr}
 .trip-row{grid-template-columns:75px 1fr 75px}
 .brand-text .tmsa{font-size:30px}
 .brand img{width:56px;height:56px}
}
</style>

       <div class="field">

   </div>
 </section>

 <section id="result"></section>
</main>

const tr=(k,n=null)=>{
 let s=(I[currentLang]||I.es)[k]||k;

function opt(text){return `<option value="">${esc(text)}</option>`}
function setSelect(sel,first,items,renderer,disabled=false){
 sel.innerHTML=opt(first)+items.map(renderer).join("");
 sel.disabled=disabled;
}
function resetArrivalTime(){
 $("#arrivalTime").textContent="--:--";
 $("#arrivalTime").classList.remove("ready");
}
function setStatus(cls,text){$("#status").innerHTML=`<span class="${cls}">${esc(text)}</span>`}
function applyLanguage(){
 document.documentElement.lang=currentLang;
 document.documentElement.dir=currentLang==="ar"?"rtl":"ltr";
 $("#brand-subtitle").textContent=tr("brand");
 $("#hero-title").textContent=tr("title");
 $("#hero-subtitle").textContent=tr("subtitle");
 $("#date-label").textContent=tr("date");
 $("#origin-label").textContent=tr("origin");
 $("#destination-label").textContent=tr("destination");
 $("#origin-stop-label").textContent=tr("originStop");
 $("#departure-label").textContent=tr("departure");
 $("#arrival-stop-label").textContent=tr("arrivalStop");
 $("#arrival-time-label").textContent=tr("arrivalTime");
 document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===currentLang));
 if(currentResult) renderResult();
}
function resetAfterOrigin(){
 setSelect($("#destination"),tr("chooseOrigin"),[],x=>x,true);
 resetAfterDestination();
}
function resetAfterDestination(){
 setSelect($("#originStop"),tr("chooseOD"),[],x=>x,true);
 setSelect($("#departure"),tr("chooseStop"),[],x=>x,true);
 setSelect($("#arrivalStop"),tr("chooseHour"),[],x=>x,true);
 resetArrivalTime();
 $("#result").innerHTML=""; currentResult=null;
}
function renderResult(){
 if(!currentResult){$("#result").innerHTML="";return}
 const r=currentResult;
 const towns=(r.via||[]).map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="town">${esc(x)}</span>`).join("");
 $("#result").innerHTML=`<article class="result-card">
  <div class="result-head">
   <span class="line-code">${esc(r.lineCode)}</span>
   <span class="line-name">${esc(r.lineName)}</span>
  </div>
  <div class="result-body">
   <div class="trip-row">
    <div class="trip-kind">${esc(tr("from"))}</div>
    <div class="trip-place">${esc(r.originTown)} · ${esc(r.originStop)}</div>
    <div class="trip-hour">${esc(r.departure)}</div>
   </div>
   <div class="trip-row">
    <div class="trip-kind">${esc(tr("to"))}</div>
    <div class="trip-place">${esc(r.destinationTown)} · ${esc(r.destinationStop)}</div>
    <div class="trip-hour">${esc(r.arrival)}</div>
   </div>
   <div class="route-info">
    <div class="route-title">${esc(tr("passes"))}</div>

   </div>
   ${r.fare?`<div class="fare"><span>${esc(tr("fare"))}</span><strong>${esc(r.fare)}</strong></div>`:""}

async function boot(){
 applyLanguage();
 $("#status").textContent=tr("loading");
 const j=await (await fetch("/api/bootstrap",{cache:"no-store"})).json();
 $("#date").value=j.today;
 const areas=j.areas||[];
 setSelect($("#origin"),tr("selOrigin"),areas,a=>`<option value="${esc(a)}">${esc(a)}</option>`,false);
 setSelect($("#destination"),tr("chooseOrigin"),[],x=>x,true);
 setSelect($("#originStop"),tr("chooseOD"),[],x=>x,true);
 setSelect($("#departure"),tr("chooseStop"),[],x=>x,true);
 setSelect($("#arrivalStop"),tr("chooseHour"),[],x=>x,true);
 resetArrivalTime();
 if(areas.length) setStatus("good",tr("ready")); else setStatus("bad",tr("noData"));
}

$("#origin").onchange=async()=>{
 const o=$("#origin").value;resetAfterOrigin();if(!o)return;
 const j=await (await fetch(`/api/destinations?origin=${encodeURIComponent(o)}&date=${encodeURIComponent($("#date").value)}`,{cache:"no-store"})).json();
 const dests=j.destinations||[];
 setSelect($("#destination"),tr("selDestination"),dests,a=>`<option value="${esc(a)}">${esc(a)}</option>`,false);
 $("#status").textContent=dests.length?tr("chooseDest"):tr("noDest");
};

async function loadStops(){
 const o=$("#origin").value,d=$("#destination").value,dt=$("#date").value;
 resetAfterDestination();if(!o||!d)return;
 const j=await (await fetch(`/api/origin-stops?origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}&date=${encodeURIComponent(dt)}`,{cache:"no-store"})).json();
 const stops=j.stops||[];
 if(!stops.length){setStatus("bad",j.message||tr("noStops"));return}
 setSelect($("#originStop"),tr("selStop"),stops,s=>`<option value="${esc(s.name)}">${esc(s.name)} · ${esc(s.lines.join(", "))}</option>`,false);
 setStatus("good",tr("stops",String(stops.length)));
}
$("#destination").onchange=loadStops;
$("#date").onchange=()=>{if($("#origin").value)$("#origin").dispatchEvent(new Event("change"))};

$("#originStop").onchange=async()=>{
 const stop=$("#originStop").value;
 setSelect($("#departure"),tr("chooseStop"),[],x=>x,true);
 setSelect($("#arrivalStop"),tr("chooseHour"),[],x=>x,true);
 resetArrivalTime();$("#result").innerHTML="";currentResult=null;
 if(!stop)return;
 const o=$("#origin").value,d=$("#destination").value,dt=$("#date").value;
 const j=await (await fetch(`/api/departures?origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}&stop=${encodeURIComponent(stop)}&date=${encodeURIComponent(dt)}`,{cache:"no-store"})).json();
 services=j.services||[];
 if(!services.length){setSelect($("#departure"),tr("noDeps"),[],x=>x,true);return}
 setSelect($("#departure"),tr("selHour"),services,(s,i)=>`<option value="${i}">${esc(s.departure)} · ${esc(s.line_code)} · ${esc(s.direction)}</option>`,false);
 setStatus("good",tr("deps",String(services.length)));
};

$("#departure").onchange=async()=>{
 const i=$("#departure").value;
 setSelect($("#arrivalStop"),tr("chooseHour"),[],x=>x,true);
 resetArrivalTime();$("#result").innerHTML="";currentResult=null;
 if(i==="")return;
 const s=services[Number(i)],stop=$("#originStop").value,dest=$("#destination").value;
 const u=`/api/arrival-stops?line_id=${encodeURIComponent(s.line_id)}&block_id=${encodeURIComponent(s.block_id)}&column=${encodeURIComponent(s.column)}&origin_stop=${encodeURIComponent(stop)}&destination=${encodeURIComponent(dest)}`;
 const j=await (await fetch(u,{cache:"no-store"})).json();
 if(!j.ok||!j.destinations.length){setStatus("bad",tr("noArrival"));return}
 $("#arrivalStop").dataset.payload=JSON.stringify({j,s});
 setSelect($("#arrivalStop"),tr("selArrival"),j.destinations,(x,k)=>`<option value="${k}">${esc(x.stop)} · ${esc(x.arrival)}</option>`,false);
 setStatus("good",tr("arrivals",String(j.destinations.length)));
};

$("#arrivalStop").onchange=()=>{
 const i=$("#arrivalStop").value;
 resetArrivalTime();$("#result").innerHTML="";currentResult=null;
 if(i==="")return;
 const p=JSON.parse($("#arrivalStop").dataset.payload);
 const d=p.j.destinations[Number(i)],s=p.s;
 $("#arrivalTime").textContent=d.arrival;
 $("#arrivalTime").classList.add("ready");
 currentResult={
  lineCode:s.line_code,lineName:s.line_name,direction:s.direction,
  originTown:$("#origin").value,originStop:$("#originStop").value,departure:s.departure,
  destinationTown:$("#destination").value,destinationStop:d.stop,arrival:d.arrival,
  via:d.via_areas||[],fare:p.j.fare||s.fare||"",days:s.days,
  validFrom:s.valid_from,validTo:s.valid_to,source:s.source
 };
 renderResult();setStatus("good",tr("selected"));
};

document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{
 currentLang=b.dataset.lang;
 localStorage.setItem("menorca_bus_lang",currentLang);
 applyLanguage();
});

boot();
</script>
</body>
</html>
